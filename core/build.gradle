plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish'
}

android {
    namespace = 'com.robowolves.wolfkit.robot'
    compileSdk 34

    defaultConfig {
        minSdkVersion 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    api project(':engine')

    // Provided by the robot controller app at runtime.
    compileOnly 'org.firstinspires.ftc:RobotCore:12.0.0'
    compileOnly 'org.firstinspires.ftc:FtcCommon:12.0.0'
    compileOnly 'org.firstinspires.ftc:Hardware:12.0.0'
}

mavenPublishing {
    coordinates(project.group.toString(), 'wolfkit-core', project.version.toString())
    pom {
        name = 'WolfKit'
        description = 'Logging, live telemetry and tuning for FTC robots, with the WolfDash dashboard.'
    }
}
